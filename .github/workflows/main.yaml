name: Digital Twin CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Enables "Run workflow" button in GitHub Actions tab

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Code Syntax & Formatting Check
        run: |
          # --fix automatically sorts imports (I001) and fixes safe formatting errors
          ruff check --fix .

      - name: Run Unit Tests
        run: |
          pytest tests/ -v