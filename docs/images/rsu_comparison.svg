<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" role="img" aria-label="Bar chart of the mean closest distance to each hidden hazard, for each version of the car. Red-light runner: Own sight only 0.35 metres, Roadside unit 7.01 metres, True positions 5.14 metres. Hidden pedestrian: Own sight only 0.0 metres, Roadside unit 5.81 metres, True positions 4.59 metres. Oncoming turner: Own sight only 0.17 metres, Roadside unit 0.57 metres, True positions 2.67 metres."><style>
