# Mosquitto 2 only accepts localhost clients unless a listener is declared, so
# without this file neither the vehicles nor the Ditto connectivity service can connect.
#
# Topics used by this project:
#   telemetry/<thing name>        vehicles -> Ditto (Ditto Protocol JSON)
#   device/<thing name>/commands  Ditto -> vehicles (SafetyGate events, retained)

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Dev/lab only: anyone on the network can publish. Do not expose beyond the lab network.
allow_anonymous true

# Keeps the retained SafetyGate state across a broker restart. Without it, a held vehicle
# has nothing to release it until someone writes the gate again.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
